global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "llm-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9001"]
        labels:
          service: "v100-local-gateway"
          env: "production"

  - job_name: "vllm-engine"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:18000"]
        labels:
          service: "vllm-hpc-cluster"
          env: "production"
