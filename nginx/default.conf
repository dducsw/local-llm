# ==============================================================================
# NGINX Reverse Proxy Configuration for Local LLM Gateway
# HTTPS on port 9443, HTTP redirect on port 9080
# ==============================================================================

# Rate limit zone for abuse protection
limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=30r/s;

# 1. HTTP Server - Redirect to HTTPS
server {
    listen 9080;
    server_name _;
    return 301 https://$host:9443$request_uri;
}

# 2. HTTPS Server - Reverse Proxy to Gateway (127.0.0.1:9001)
server {
    listen 9443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Client Request Limits
    client_max_body_size 50M;

    # Main Gateway Proxy
    location / {
        limit_req zone=gateway_limit burst=50 nodelay;

        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;

        # WebSocket & Connection Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE (Server-Sent Events) Streaming Optimization - Zero Buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Extended Timeouts for Long LLM Generation
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
