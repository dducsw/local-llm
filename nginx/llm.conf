# ==============================================================================
# Nginx Reverse Proxy Configuration for Local LLM Gateway
# Subpath: /llm -> http://127.0.0.1:9001
# ==============================================================================

# 1. Chuyển tiếp nếu người dùng gõ thiếu dấu gạch chéo cuối /llm
location = /llm {
    return 301 /llm/;
}

# 2. Proxy toàn bộ Dashboard, Static Assets và OpenAI API endpoints
location /llm/ {
    proxy_pass http://127.0.0.1:9001/;
    proxy_http_version 1.1;

    # Headers chuyển tiếp chuẩn
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /llm;

    # QUAN TRỌNG: Tắt buffer để SSE Stream token của LLM hiển thị thời gian thực
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # Timeout dài tránh ngắt kết nối khi LLM suy nghĩ / sinh văn bản lớn
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
}
