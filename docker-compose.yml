services:
  # 1. PostgreSQL Database (Unified for both Gateway & Langfuse)
  db:
    image: postgres:16-alpine
    container_name: v100-local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=postgres
    volumes:
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Local LLM Application Gateway
  gateway:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: v100-local-gateway
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GATEWAY_VERSION=${GATEWAY_VERSION:-1.1.0}
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@127.0.0.1:5432/gateway
      - LANGFUSE_ENABLE=${LANGFUSE_ENABLE:-true}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://127.0.0.1:3000}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-gateway-local}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-gateway-local}

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 128M

    volumes:
      - ./app/data:/workspace/app/data
      - ./app/config:/workspace/app/config
      - ./app/app:/workspace/app/app
      - ./app/ui:/workspace/app/ui

    secrets:
      - hpc_ssh_key

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "hpc-node16:10.1.1.239"

  # 3. Langfuse Observability & Prompt Management
  langfuse-server:
    image: ghcr.io/langfuse/langfuse:2
    container_name: v100-local-langfuse
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=a8f9c1b3e5d7f2a4b6c8e0d2f4a6b8c0e2d4f6a8b0c2e4d6f8a0b2c4e6d8f0a2
      - SALT=c2e4d6f8a0b2c4e6d8f0a2b4c6e8d0f2a4b6c8e0d2f4a6b8c0e2d4f6a8b0c2e4
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - TELEMETRY_ENABLED=false
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true

  # 4. NGINX Reverse Proxy with SSL (HTTPS: 9443, HTTP: 9080)
  nginx:
    image: nginx:alpine
    container_name: v100-local-nginx
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - gateway
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  # 5. Prometheus Time-Series Scraper & Storage
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: v100-local-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

  # 6. Grafana Enterprise LLMOps Observability Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: v100-local-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/llm_gateway_dashboard.json
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

secrets:
  hpc_ssh_key:
    file: ${HPC_HOST_SSH_KEY:-/root/.ssh/id_ed25519}

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
